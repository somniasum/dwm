; ~/.config/gamemode.ini  (used when a game is started with `gamemoderun`)
[general]
; nice -10 and top best-effort I/O priority for the game
renice=10
ioprio=0
; softrealtime needs the SCHED_ISO scheduler policy, which stock/CachyOS (BORE/EEVDF) kernels lack
softrealtime=off
inhibit_screensaver=1
desiredgov=performance
