# dwm-setup performance tuning for an 8 GB RAM / spinning-disk / zram machine.
# Loaded after distro defaults (99-), so these win.

# zram swap is RAM-speed; your HDD is not. Prefer compressing cold pages into zram over
# throwing away file cache that would have to be re-read from the disk (valid range 0-200).
vm.swappiness = 150
# zram has no seek cost, so don't read swap in clusters.
vm.page-cluster = 0
# Keep directory/inode caches around longer: fewer HDD seeks when a game or build walks files.
vm.vfs_cache_pressure = 50
# Start background writeback at 64 MB, hard-throttle writers at 256 MB. Fixed byte sizes instead of
# percentages, so a big RAM cache can't build up and then stall everything in one long flush on the HDD.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
# Drop the NMI watchdog: one less periodic interrupt on every core.
kernel.nmi_watchdog = 0
