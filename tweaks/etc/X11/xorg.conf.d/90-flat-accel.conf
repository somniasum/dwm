# Flat (no) pointer acceleration: 1:1 mouse movement, which is what you want for aiming.
# Named 90- so it is read after the distro's 40-libinput.conf and wins. Needs an X restart.
Section "InputClass"
	Identifier "flat accel"
	MatchIsPointer "on"
	MatchIsTouchpad "off"
	MatchDriver "libinput"
	Option "AccelProfile" "flat"
EndSection
